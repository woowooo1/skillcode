<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>던파 스킬코드</title>
</head>
<body>
<button onclick="openCopyWindow()">스킬코드 복사</button>

<script>
function openCopyWindow() {
    const code = "여기에_긴_스킬코드";

    const win = window.open(
        "",
        "SkillCopy",
        "width=420,height=230,resizable=no"
    );

    if (!win) {
        alert("팝업이 차단되었습니다.");
        return;
    }

    win.document.write(`
        <html>
        <meta charset="UTF-8">
        <body style="font-family:sans-serif;padding:15px;">
            <h3>스킬코드 복사</h3>
            <textarea id="code"
              style="width:100%;height:75px;"></textarea>
            <button id="copy">복사하기</button>
            <script>
                document.getElementById('code').value =
                    ${JSON.stringify("여기에_긴_스킬코드")};

                document.getElementById('copy').onclick =
                    async function() {
                        await navigator.clipboard.writeText(
                            document.getElementById('code').value
                        );
                        this.textContent = '복사 완료!';
                    };
            <\/script>
        </body>
        </html>
    `);
}
</script>
</body>
</html>
